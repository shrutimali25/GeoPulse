[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopulse"
version = "0.1.0"
description = "GeoPulse: Hyper-Local Retail Mobility Analytics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GeoPulse Team"}
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "numpy>=1.26.0,<2.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.9.0"
]
spatial = [
    "shapely>=2.0.4",
    "geopandas>=0.14.3",
    "pyarrow>=15.0.0",
    "h3>=3.7.6,<4.0.0",
    "pyspark==3.5.1",
    "apache-sedona>=1.6.0"
]
snowflake = [
    "snowflake-connector-python>=3.9.0",
    "snowflake-snowpark-python>=1.15.0",
    "dbt-snowflake>=1.7.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
